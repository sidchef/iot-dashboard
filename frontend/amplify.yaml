version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm --prefix frontend ci
    build:
      commands:
        - npm --prefix frontend run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - frontend/node_modules/**/*